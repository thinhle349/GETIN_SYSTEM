<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>GETIN SYSTEM</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>


<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  padding: 20px;

  font-family: Arial, sans-serif;

  background: #f3f5f7;

  text-align: center;

}

.header {

  background: #24577f;

  color: white;

  padding: 25px 15px;

  margin: -20px -20px 20px;

}

.header h1 {

  margin: 0;

  font-size: 30px;

}

.header p {

  margin: 8px 0 0;

  font-size: 20px;

}

.container {

  max-width: 500px;

  margin: auto;

  background: white;

  padding: 20px;

  border-radius: 15px;

  box-shadow:
    0 3px 15px rgba(0,0,0,0.12);

}

.section {

  margin-bottom: 30px;

  padding-bottom: 25px;

  border-bottom: 1px solid #ddd;

}

input {

  width: 100%;

  padding: 14px;

  margin-top: 10px;

  border: 1px solid #ccc;

  border-radius: 8px;

  font-size: 16px;

}

button {

  width: 100%;

  padding: 15px;

  margin-top: 10px;

  border: none;

  border-radius: 10px;

  font-size: 17px;

  font-weight: bold;

  cursor: pointer;

}

.primary {

  background: #1976d2;

  color: white;

}

.secondary {

  background: #777;

  color: white;

}

.green {

  background: #16803c;

  color: white;

}

#reader {

  width: 100%;

  margin: 20px auto;

}

#result {

  margin-top: 20px;

  padding: 20px;

  background: #eee;

  border-radius: 10px;

  min-height: 80px;

  font-size: 18px;

  line-height: 1.5;

  word-break: break-word;

}

.success {

  color: #16803c;

  font-weight: bold;

}

.error {

  color: #d93025;

  font-weight: bold;

}

.loading {

  color: #b26a00;

  font-weight: bold;

}

#qrDisplay {

  margin-top: 20px;

}

#qrCode {

  display: flex;

  justify-content: center;

  margin: 20px 0;

}

.info {

  background: #f5f5f5;

  padding: 12px;

  border-radius: 8px;

  margin-top: 10px;

}

</style>

</head>


<body>


<div class="header">

  <h1>GETIN SYSTEM</h1>

  <p>QUẢN LÝ XE & CONTAINER</p>

</div>


<div class="container">


<!-- =================================
     TẠO QR
================================= -->

<div class="section">

<h2>➕ TẠO QR XE</h2>


<input
  id="soXe"
  type="text"
  placeholder="Nhập số xe"
>


<input
  id="soContainer"
  type="text"
  placeholder="Nhập số container"
>


<button
  class="green"
  onclick="createQR()"
>
  ➕ TẠO MÃ QR
</button>


<div id="createResult"></div>


<div
  id="qrDisplay"
  style="display:none;"
>

  <h3>QR CỦA XE</h3>

  <div id="qrCode"></div>

  <div class="info">

    <div>
      <strong>Mã QR:</strong>
      <span id="createdQR"></span>
    </div>

    <div>
      <strong>Số xe:</strong>
      <span id="createdVehicle"></span>
    </div>

    <div>
      <strong>Container:</strong>
      <span id="createdContainer"></span>
    </div>

  </div>


  <button
    class="primary"
    onclick="window.print()"
  >
    🖨️ IN QR
  </button>

</div>

</div>


<!-- =================================
     QUÉT QR
================================= -->

<div class="section">

<h2>📷 QUÉT QR</h2>


<div id="reader"></div>


<button
  class="primary"
  onclick="startCamera()"
>
  📷 MỞ CAMERA
</button>


<button
  class="secondary"
  onclick="clearResult()"
>
  🗑️ XÓA KẾT QUẢ
</button>


<div id="result">

  Chưa quét mã

</div>

</div>


</div>


<script>


/* =================================
   APPS SCRIPT
================================= */

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbzyZsjQpb9eT02KnDrkS7EqAxmH2p8_Mu4JQll4u3wmNiKKdhmYfrAIIawAOtsn-yT7/exec";


let scanner = null;

let cameraRunning = false;

let lastQR = "";


/* =================================
   TẠO QR
================================= */

function createQR() {

  const soXe =
    document
      .getElementById("soXe")
      .value
      .trim();

  const soContainer =
    document
      .getElementById("soContainer")
      .value
      .trim();


  if (!soXe) {

    document.getElementById(
      "createResult"
    ).innerHTML =
      "<span class='error'>" +
      "❌ Vui lòng nhập số xe." +
      "</span>";

    return;

  }


  if (!soContainer) {

    document.getElementById(
      "createResult"
    ).innerHTML =
      "<span class='error'>" +
      "❌ Vui lòng nhập số container." +
      "</span>";

    return;

  }


  document.getElementById(
    "createResult"
  ).innerHTML =
    "<span class='loading'>" +
    "⏳ Đang tạo QR..." +
    "</span>";


  const callbackName =
    "createCallback_" +
    Date.now();


  window[callbackName] =
    function(response) {


      delete window[callbackName];


      if (
        response &&
        response.success
      ) {


        document.getElementById(
          "createResult"
        ).innerHTML =
          "<span class='success'>" +
          "✅ Tạo QR thành công." +
          "</span>";


        document.getElementById(
          "qrDisplay"
        ).style.display =
          "block";


        document.getElementById(
          "createdQR"
        ).textContent =
          response.qr;


        document.getElementById(
          "createdVehicle"
        ).textContent =
          response.soXe;


        document.getElementById(
          "createdContainer"
        ).textContent =
          response.soContainer;


        const qrContainer =
          document.getElementById(
            "qrCode"
          );


        qrContainer.innerHTML =
          "";


        new QRCode(
          qrContainer,
          {

            text:
              response.qr,

            width: 220,

            height: 220

          }
        );


      } else {


        document.getElementById(
          "createResult"
        ).innerHTML =
          "<span class='error'>" +
          "❌ " +
          (
            response.message ||
            "Không tạo được QR."
          ) +
          "</span>";

      }

    };


  const url =

    APPS_SCRIPT_URL +

    "?action=create" +

    "&soXe=" +
    encodeURIComponent(soXe) +

    "&soContainer=" +
    encodeURIComponent(
      soContainer
    ) +

    "&callback=" +
    encodeURIComponent(
      callbackName
    );


  const script =
    document.createElement(
      "script"
    );


  script.src = url;


  script.onerror =
    function() {

      document.getElementById(
        "createResult"
      ).innerHTML =
        "<span class='error'>" +
        "❌ Không kết nối được Apps Script." +
        "</span>";

      delete window[callbackName];

    };


  document.body.appendChild(
    script
  );

}


/* =================================
   MỞ CAMERA
================================= */

function startCamera() {

  if (cameraRunning) {

    return;

  }


  lastQR = "";


  document.getElementById(
    "result"
  ).innerHTML =
    "📷 Đang mở camera...";


  scanner =
    new Html5Qrcode(
      "reader"
    );


  scanner.start(

    {
      facingMode:
        "environment"
    },

    {
      fps: 10,

      qrbox: {

        width: 250,

        height: 250

      }

    },


    function(decodedText) {


      if (
        lastQR === decodedText
      ) {

        return;

      }


      lastQR =
        decodedText;


      document.getElementById(
        "result"
      ).innerHTML =

        "<div class='success'>" +
        "✅ ĐÃ QUÉT QR" +
        "</div>" +

        "<br>" +

        "<strong>Mã QR:</strong>" +

        "<div>" +
        decodedText +
        "</div>" +

        "<br>" +

        "<span class='loading'>" +
        "⏳ Đang kiểm tra..." +
        "</span>";


      sendQR(
        decodedText
      );

    },


    function(errorMessage) {

      // Không hiển thị lỗi
      // khi camera đang tìm QR.

    }

  )

  .then(
    function() {

      cameraRunning =
        true;


      document.getElementById(
        "result"
      ).innerHTML =

        "📷 Camera đang hoạt động." +
        "<br><br>" +
        "Đưa mã QR vào khung.";

    }
  )

  .catch(
    function(error) {

      document.getElementById(
        "result"
      ).innerHTML =

        "<span class='error'>" +
        "❌ Không mở được camera." +
        "<br><br>" +
        error +
        "</span>";

    }
  );

}


/* =================================
   GỬI QR
================================= */

function sendQR(qrCode) {


  const callbackName =
    "scanCallback_" +
    Date.now();


  window[callbackName] =
    function(response) {


      delete window[callbackName];


      if (
        response &&
        response.success
      ) {


        document.getElementById(
          "result"
        ).innerHTML =

          "<div class='success'>" +
          "✅ QR HỢP LỆ" +
          "</div>" +

          "<br>" +

          "<strong>Số xe:</strong><br>" +
          (
            response.soXe ||
            "Chưa có"
          ) +

          "<br><br>" +

          "<strong>Container:</strong><br>" +
          (
            response.soContainer ||
            "Chưa có"
          ) +

          "<br><br>" +

          "<strong>Trạng thái:</strong><br>" +
          (
            response.trangThai ||
            ""
          );

      } else {


        document.getElementById(
          "result"
        ).innerHTML =

          "<span class='error'>" +

          "❌ " +

          (
            response.message ||
            "QR không hợp lệ."
          ) +

          "</span>";

      }

    };


  const url =

    APPS_SCRIPT_URL +

    "?qr=" +
    encodeURIComponent(
      qrCode
    ) +

    "&callback=" +
    encodeURIComponent(
      callbackName
    );


  const script =
    document.createElement(
      "script"
    );


  script.src =
    url;


  script.onerror =
    function() {

      document.getElementById(
        "result"
      ).innerHTML =

        "<span class='error'>" +

        "❌ Không kết nối được Apps Script." +

        "</span>";

      delete window[callbackName];

    };


  document.body.appendChild(
    script
  );

}


/* =================================
   XÓA KẾT QUẢ
================================= */

function clearResult() {

  lastQR = "";

  document.getElementById(
    "result"
  ).innerHTML =
    "Chưa quét mã";

}

</script>

</body>

</html>
