<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GETIN SYSTEM</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f3f5f7;
      text-align: center;
    }

    .header {
      background: #24577f;
      color: white;
      padding: 25px 15px;
      margin: -20px -20px 20px;
    }

    .header h1 {
      margin: 0;
      font-size: 30px;
    }

    .header p {
      margin: 8px 0 0;
      font-size: 20px;
    }

    .container {
      max-width: 500px;
      margin: 20px auto;
      background: white;
      padding: 20px;
      border-radius: 15px;
    }

    #reader {
      width: 100%;
      margin: 20px auto;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
    }

    #startBtn {
      background: #1976d2;
      color: white;
    }

    #clearBtn {
      background: #777;
      color: white;
    }

    #result {
      margin-top: 20px;
      padding: 20px;
      background: #eee;
      border-radius: 10px;
      min-height: 80px;
      font-size: 18px;
      word-break: break-word;
    }

    .success {
      color: green;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>GETIN SYSTEM</h1>
    <p>CỔNG OUT</p>
  </div>

  <div class="container">

    <h2>QUÉT QR XE OUT</h2>

    <div id="reader"></div>

    <button id="startBtn" onclick="startCamera()">
      📷 MỞ CAMERA
    </button>

    <button id="clearBtn" onclick="clearResult()">
      🗑️ XÓA KẾT QUẢ
    </button>

    <div id="result">
      Chưa quét mã
    </div>

  </div>

<script>

let scanner = null;
let cameraRunning = false;
let lastQR = "";


function startCamera() {

  if (cameraRunning) {
    return;
  }

  document.getElementById("result").innerHTML =
    "📷 Đang mở camera...";

  scanner = new Html5Qrcode("reader");


  scanner.start(
    {
      facingMode: "environment"
    },

    {
      fps: 10,
      qrbox: {
        width: 250,
        height: 250
      }
    },

    function(decodedText, decodedResult) {

      console.log("========== QR DETECTED ==========");
      console.log("QR:", decodedText);
      console.log("Result:", decodedResult);

      lastQR = decodedText;


      // CHỈ HIỂN THỊ KẾT QUẢ
      // KHÔNG DỪNG CAMERA
      document.getElementById("result").innerHTML =
        "<div class='success'>" +
        "✅ ĐÃ QUÉT QR" +
        "</div>" +
        "<br>" +
        "<strong>Mã QR:</strong>" +
        "<br><br>" +
        "<span style='font-size:22px;'>" +
        decodedText +
        "</span>";

    },

    function(errorMessage) {
      // Không làm gì khi chưa tìm thấy QR
    }

  )

  .then(function() {

    cameraRunning = true;

    document.getElementById("result").innerHTML =
      "📷 Camera đang hoạt động.<br>" +
      "Đưa mã QR vào khung.";

  })

  .catch(function(error) {

    console.error(error);

    document.getElementById("result").innerHTML =
      "❌ Không mở được camera<br><br>" +
      error;

  });

}


function clearResult() {

  lastQR = "";

  document.getElementById("result").innerHTML =
    "Chưa quét mã";

}

</script>

</body>
</html>
