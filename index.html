<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GETIN SYSTEM</title>

  <!-- Thư viện quét QR -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f3f5f7;
      text-align: center;
    }

    .header {
      background: #24577f;
      color: white;
      padding: 25px 15px;
      margin: -20px -20px 20px;
    }

    .header h1 {
      margin: 0;
      font-size: 30px;
      font-weight: bold;
    }

    .header p {
      margin: 8px 0 0;
      font-size: 20px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 3px 15px rgba(0, 0, 0, 0.12);
    }

    h2 {
      color: #24577f;
      margin: 5px 0 20px;
      font-size: 26px;
    }

    #reader {
      width: 100%;
      margin: 20px auto;
      overflow: hidden;
      border-radius: 10px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    #startBtn {
      background: #1976d2;
      color: white;
    }

    #stopBtn {
      background: #777;
      color: white;
    }

    button:active {
      opacity: 0.8;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      background: #f1f1f1;
      min-height: 60px;
      word-break: break-word;
      font-size: 17px;
      line-height: 1.5;
    }

    .success {
      color: #16803c;
      font-weight: bold;
    }

    .error {
      color: #d93025;
      font-weight: bold;
    }

    .qr-value {
      margin-top: 8px;
      padding: 10px;
      background: white;
      border-radius: 8px;
      font-weight: bold;
      color: #222;
    }

    .note {
      margin-top: 15px;
      color: #666;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>GETIN SYSTEM</h1>
    <p>CỔNG OUT</p>
  </div>

  <div class="container">

    <h2>QUÉT QR XE OUT</h2>

    <!-- Khu vực camera -->
    <div id="reader"></div>

    <!-- Nút mở camera -->
    <button id="startBtn" onclick="startScanner()">
      📷 MỞ CAMERA
    </button>

    <!-- Nút dừng camera -->
    <button id="stopBtn" onclick="stopScanner()">
      ⛔ DỪNG CAMERA
    </button>

    <!-- Kết quả -->
    <div id="result">
      Chưa quét mã
    </div>

    <div class="note">
      Đưa mã QR vào giữa khung camera để quét.
    </div>

  </div>


<script>

  let scanner = null;
  let scanning = false;
  let qrScanned = false;


  // ==============================
  // MỞ CAMERA
  // ==============================

  function startScanner() {

    if (scanning) {
      return;
    }

    qrScanned = false;

    document.getElementById("result").innerHTML =
      "📷 Đang mở camera...";

    scanner = new Html5Qrcode("reader");


    scanner.start(

      {
        facingMode: "environment"
      },

      {
        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        },

        aspectRatio: 1.0

      },

      function(decodedText, decodedResult) {

        // Tránh quét lặp lại cùng một QR
        if (qrScanned) {
          return;
        }

        qrScanned = true;

        console.log("QR đã quét:", decodedText);


        // Hiển thị kết quả NGAY LẬP TỨC
        document.getElementById("result").innerHTML =
          "<span class='success'>✅ ĐÃ QUÉT QR</span>" +
          "<div class='qr-value'>" +
          "Mã QR:<br>" +
          decodedText +
          "</div>";


        // Dừng camera sau khi đã lưu kết quả
        stopScanner();


      },

      function(errorMessage) {

        // Đây chỉ là lỗi trong lúc camera đang tìm QR.
        // Không hiển thị để tránh làm rối giao diện.

      }

    )

    .then(function() {

      scanning = true;

      document.getElementById("result").innerHTML =
        "📷 Camera đang hoạt động.<br>" +
        "Đưa mã QR vào khung để quét.";

    })

    .catch(function(error) {

      console.error("Camera error:", error);

      document.getElementById("result").innerHTML =
        "<span class='error'>" +
        "❌ KHÔNG THỂ MỞ CAMERA" +
        "<br><br>" +
        error +
        "</span>";

    });

  }


  // ==============================
  // DỪNG CAMERA
  // ==============================

  function stopScanner() {

    if (!scanner || !scanning) {
      return;
    }


    scanner.stop()

      .then(function() {

        scanner.clear();

        scanning = false;

        // QUAN TRỌNG:
        // Không ghi đè kết quả QR ở đây.
        // Kết quả đã được hiển thị trước khi gọi hàm này.

        console.log("Camera đã dừng.");

      })

      .catch(function(error) {

        console.error(
          "Không thể dừng camera:",
          error
        );

        scanning = false;

      });

  }

</script>

</body>
</html>
